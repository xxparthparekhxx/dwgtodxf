[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "dwgtodxf"
version = "0.1.0"
description = "Fast DWG to DXF/PDF converter with its own Rust DWG decoder - no external tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xxparthparekhxx" }]
keywords = ["dwg", "dxf", "cad", "autocad", "converter", "pdf", "drawing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xxparthparekhxx/dwgtodxf"
Repository = "https://github.com/xxparthparekhxx/dwgtodxf"
Issues = "https://github.com/xxparthparekhxx/dwgtodxf/issues"

[project.optional-dependencies]
# reading into ezdxf documents and rendering PDF
pdf = ["ezdxf>=1.3", "pymupdf>=1.24", "pillow"]
dev = ["pytest>=8", "ezdxf>=1.3", "pymupdf>=1.24", "pillow"]

[project.scripts]
dwgtodxf = "dwgtodxf.cli:main"

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "dwgtodxf._native"
features = []

[tool.pytest.ini_options]
testpaths = ["tests"]
